; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

; Custom section (not schema-validated by PlatformIO, unlike [env]/[env:*]) holding
; lib_deps lists shared across the atmelavr environments below. Previously these
; two keys lived in [env] itself, which caused "Ignore unknown configuration
; option" warnings on every pio check/run/test invocation (BUG-001) since [env]'s
; keys are validated against a known schema that doesn't include them.
[common]
; This does not use the SPI bus, but we need the SPI header for BusIO library
lib_deps_builtin =
    SPI
    Wire

lib_deps_external =
    PinChangeInterrupt
    ; Not used anymore. Use the built in shiftOut() function 8/14/24.
    ; ShiftRegister74HC595
    adafruit/RTCLib
    ; hv ps is not used anymore, thus no PID controller. 8/14/24
    ; https://github.com/jhrg/Arduino-PID-Library.git

[env]
platform = atmelavr
framework = arduino

monitor_speed = 115200

build_flags =
    -D VERSION=0.6
    -D ADJUST_TIME=0  ; 10
    -D USE_DS3231=1
    -D USE_DS1307=0
    -D DEBUG=1

[env:pro16MHzatmega328]
board = pro16MHzatmega328

;; Build options
build_flags =
    ${env.build_flags}

;; Dependencies
lib_deps =
    ${common.lib_deps_builtin}
    ${common.lib_deps_external}

build_src_filter = +<*.cc> +<*.cpp>  ; exclude hv_ps.cc 8/14/24

[env:uno]
board = uno
;; Build options
build_flags =
    ${env.build_flags}

;; Dependencies
lib_deps =
    ${common.lib_deps_builtin}
    ${common.lib_deps_external}

build_src_filter = +<*.cc> +<*.cpp>  ; exclude hv_ps.cc 8/14/24

[env:hv_ps_test]
;; This shows how to build and run test code
build_flags = -D DEBUG=1 -D PID_DIAGNOSTIC=1

build_src_filter = +<../hv_ps_test/hv_ps_test.cc> +<hv_ps.cc> +<print.cc> ; only use these source files

lib_deps = https://github.com/jhrg/Arduino-PID-Library.git

; Host-run unit tests for Arduino-independent logic (TASK-001). Defined standalone,
; not inheriting [env]'s build_flags/lib_deps, since those target the atmelavr
; platform and pull in Arduino-only libraries (SPI, Wire, PinChangeInterrupt,
; adafruit/RTCLib) that don't exist for the native platform.
[env:native]
platform = native
framework =
build_flags = -std=c++14

; Pull project src/ files into the test build (filtered below), since the logic
; under test lives in src/, not in a PlatformIO library.
test_build_src = yes

; Only these files are Arduino-independent. main.cpp, mode_switch2.cc, RTC.cc,
; and print.cc all include Arduino.h and cannot build for the native platform.
build_src_filter = -<*> +<button_timing.cc> +<brightness.cc> +<display_mode.cc> +<display_digits.cc>

